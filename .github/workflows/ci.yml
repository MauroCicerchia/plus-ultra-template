name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Formatting and lint. `biome ci` never writes and annotates the diff.
      - run: pnpm biome ci .

      # Root script, not `pnpm -r typecheck`: the recursive form skips the root
      # tsconfig, which owns the `api/[...path].ts` Vercel entrypoint.
      - run: pnpm typecheck

      - run: pnpm -r test

      - run: pnpm build
